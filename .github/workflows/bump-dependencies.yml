# Opens "Bump timetug-shared to X.Y.Z" when timetug-shared releases (repository_dispatch from its release
# workflow), or on demand. The pull request is opened with a timetug-bot token so its CI runs; the workflow
# never merges anything: the owner merges. Since phase 6 of the Rust program the connector library comes inside
# timetug-shared and the Mac app no longer pins it, so a calendar-connectors dispatch (the connectors' notify
# job may still send one) ends with a notice and no pull request, and does not fail. A newer bump closes the
# open bump pull requests for older versions of timetug-shared. LIBRARY and VERSION are validated by the
# "Move the pin" step before either reaches a command line.
name: Bump dependencies

on:
  repository_dispatch:
    types: [library-released]
  workflow_dispatch:
    inputs:
      library:
        description: "Library to bump"
        required: true
        type: choice
        options:
          - timetug-shared
      version:
        description: "Library version (X.Y.Z)"
        required: true
        type: string

concurrency:
  group: bump-${{ github.event.client_payload.library || inputs.library }}
  cancel-in-progress: false

permissions: {}

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch' || contains(fromJSON('["calendar-connectors","timetug-shared"]'), github.event.client_payload.library)
    runs-on: ubuntu-latest
    environment: bump
    permissions:
      contents: read
    env:
      LIBRARY: ${{ github.event.client_payload.library || inputs.library }}
      VERSION: ${{ github.event.client_payload.version || inputs.version }}
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.BUMP_APP_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: timetug
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          token: ${{ steps.app.outputs.token }}
      - name: Skip new major versions
        id: guard
        run: |
          set -euo pipefail
          # calendar-connectors is no longer pinned by the Mac app (phase 6 of the Rust program): its dispatch
          # ends here with a notice, successfully, so the connectors' notify job is not red.
          case "$LIBRARY" in
            calendar-connectors)
              echo "::notice::calendar-connectors $VERSION: the Mac app no longer pins the connector library (phase 6 of the Rust program); it comes inside timetug-shared, so there is nothing to bump"
              echo "decision=skip" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          # A new major version of timetug-shared beyond the pinned one (3.0.0 and up) is held for a deliberate
          # move. The guard checks LIBRARY and VERSION itself (exit 2 on anything that is not a library name and
          # X.Y.Z), then prints proceed or skip; on skip every remaining step is gated off and the job ends
          # successfully.
          decision="$(scripts/ci/bump-major-guard.sh "$LIBRARY" "$VERSION")"
          if [ "$decision" = skip ]; then
            echo "::notice::$LIBRARY $VERSION is a new major version; the Mac app is held on the pinned major until it is moved deliberately"
          fi
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
      - name: Move the pin
        if: steps.guard.outputs.decision == 'proceed'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          # Both values come from a dispatch payload or an input. contains() in the job `if` compares without
          # case, so the allow-list is checked again here, exactly, before either value is used in a path or
          # a command.
          case "$LIBRARY" in
            timetug-shared) ;;
            *) echo "::error::not a library this workflow bumps: $LIBRARY"; exit 2 ;;
          esac
          pattern='^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$'
          if ! [[ "$VERSION" =~ $pattern ]]; then
            echo "::error::not X.Y.Z (at most 9 digits per number): $VERSION"
            exit 2
          fi
          scripts/ci/bump-pin.sh "$LIBRARY" "$VERSION"
      - name: Open the pull request
        if: steps.guard.outputs.decision == 'proceed'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then echo "Already at $VERSION; nothing to do."; exit 0; fi
          branch="bump/$LIBRARY-$VERSION"
          # A re-delivered event or a manual re-run must not fail on work that is already in flight.
          # `--head` matches the head branch name across forks, so only same-repository heads count.
          number="$(gh pr list --head "$branch" --state open --json number,isCrossRepository \
            --jq 'map(select(.isCrossRepository | not)) | .[0].number // empty')"
          if [ -n "$number" ]; then
            echo "A pull request for $branch is already open (#$number)."
          else
            branch_pushed=false
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              # An earlier run pushed the branch but could not open the pull request; open it from that branch.
              branch_pushed=true
              echo "Branch $branch exists without an open pull request; opening one from it."
            fi
            # Build the body first so that a failure here cannot leave a pushed branch without a pull request.
            {
              echo "Moves the pinned $LIBRARY to $VERSION. CI on this pull request proves the app still builds and passes its tests."
              echo
              echo "## Release notes"
              gh release view "$VERSION" --repo "binary-companion/$LIBRARY" --json body --jq .body \
                || echo "(The release notes could not be read; see the release $VERSION in binary-companion/$LIBRARY.)"
              echo
              echo "🤖 Opened by timetug-bot"
            } > "$RUNNER_TEMP/body.md"
            if [ "$branch_pushed" = false ]; then
              git config user.name "timetug-bot[bot]"
              git config user.email "342080999+timetug-bot[bot]@users.noreply.github.com"
              git switch -c "$branch"
              git commit -am "Bump $LIBRARY to $VERSION"
              git push origin "$branch"
            fi
            url="$(gh pr create --base master --head "$branch" \
              --title "Bump $LIBRARY to $VERSION" --body-file "$RUNNER_TEMP/body.md")"
            echo "$url"
            number="${url##*/}"
          fi
          # Supersede older bump pull requests. Only same-repository pull requests whose head branch is exactly
          # bump/timetug-shared-X.Y.Z with a lower version than this one are closed (versions compared
          # numerically with sort -V, never as strings); every other pull request is left alone. Each close is
          # independent: one failure is reported and the step fails at the end, after the other closes were tried.
          open_prs="$(gh pr list --state open --limit 100 --json number,headRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | "\(.number) \(.headRefName)"')"
          failed=0
          while read -r old_number old_head; do
            [[ "$old_head" =~ ^bump/timetug-shared-([0-9]+\.[0-9]+\.[0-9]+)$ ]] || continue
            old_version="${BASH_REMATCH[1]}"
            [ "$old_version" != "$VERSION" ] || continue
            [ "$(printf '%s\n%s\n' "$old_version" "$VERSION" | sort -V | head -n 1)" = "$old_version" ] || continue
            echo "Closing #$old_number ($old_head): superseded by #$number."
            gh pr close "$old_number" --comment "Superseded by #$number" --delete-branch \
              || { echo "::warning::could not close #$old_number"; failed=1; }
          done <<< "$open_prs"
          exit "$failed"
